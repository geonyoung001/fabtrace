[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fab-scope"
version = "0.1.0"
description = "WM811K wafer defect classification"
requires-python = ">=3.10"

# ml 패키지를 editable(-e)로 설치하기 위한 최소 설정.
# `pip install -e .` 후에는 실행 위치·방식과 무관하게 `import ml`이 동작한다.
[tool.setuptools.packages.find]
include = ["ml*"]
